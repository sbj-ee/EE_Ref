<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432.00 648.00" width="6.0000in" height="9.0000in">
  <!-- problems volume front cover, 6.0 x 9.0 in trim. Generated by scripts/generate_cover_wrap.py; the printed case is cover-wrap-problems.pdf. -->
  <defs>
    <filter id="leather" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6500" numOctaves="4" seed="2" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#2d5a27" surfaceScale="1.5" result="lit">
        <feDistantLight azimuth="225" elevation="35"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceGraphic" operator="multiply"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d98e"/><stop offset="30%" stop-color="#d4a520"/>
      <stop offset="50%" stop-color="#f5e6a3"/><stop offset="70%" stop-color="#d4a520"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5d98e"/><stop offset="30%" stop-color="#d4a520"/>
      <stop offset="50%" stop-color="#f5e6a3"/><stop offset="70%" stop-color="#d4a520"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a520"/><stop offset="50%" stop-color="#f5e6a3"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="textEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.46" dy="0.46" stdDeviation="0.31"
                    flood-color="#0a2e0a" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="432.00" height="648.00" fill="#1e5a1e"/>
  <rect x="0" y="0" width="432.00" height="648.00" filter="url(#leather)" opacity="0.6"/>
  <rect x="23.14" y="23.14" width="385.71" height="601.71" fill="none" stroke="url(#goldLine)" stroke-width="1.16" opacity="0.85"/>
  <rect x="30.86" y="30.86" width="370.29" height="586.29" fill="none" stroke="url(#goldLine)" stroke-width="0.54" opacity="0.6"/>
  <text x="216.00" y="254.57" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="29.31" font-weight="bold" text-anchor="middle" letter-spacing="2.31" filter="url(#textEmboss)">ELECTRICAL</text>
  <text x="216.00" y="291.60" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="29.31" font-weight="bold" text-anchor="middle" letter-spacing="2.31" filter="url(#textEmboss)">ENGINEERING</text>
  <text x="216.00" y="328.63" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="29.31" font-weight="bold" text-anchor="middle" letter-spacing="2.31" filter="url(#textEmboss)">REFERENCE</text>
  <text x="216.00" y="412.71" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="16.97" font-style="italic" text-anchor="middle" letter-spacing="3.86" filter="url(#textEmboss)">Problem Sets</text>
  <line x1="177.43" y1="432.00" x2="254.57" y2="432.00" stroke="url(#goldLine)" stroke-width="0.62" opacity="0.6"/>
  <text x="216.00" y="493.71" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="15.43" text-anchor="middle" letter-spacing="3.09" filter="url(#textEmboss)">STEPHEN B. JOHNSON</text>
